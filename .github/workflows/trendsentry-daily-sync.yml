# —— TrendSentry daily sync ———
# Trigger Vercel cron endpoint to sync user trades & log deviations.
name: trendsentry-daily-sync

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger cron sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trendsentry.vercel.app/api/cron/daily-sync" || echo "sync failed (may be first deploy)"
