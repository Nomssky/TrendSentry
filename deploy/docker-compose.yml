# Validasi lokal paket migrasi (tanpa VPS): web + engine lawan Supabase cloud.
# Di VPS via Coolify: web = push-to-deploy, Supabase = one-click service,
# engine = service ini + systemd timer host (lihat RUNBOOK.md).
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-}
    ports:
      - "3000:3000"

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ../db:/srv/trendsentry/db
      - ../data:/srv/trendsentry/data:ro
    # Dijalankan via: docker compose run --rm engine
    # (cron/systemd di VPS; manual lokal)
