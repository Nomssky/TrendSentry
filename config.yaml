# Config parameter strategi — jangan hardcode angka ini di dalam kode.
# Perubahan parameter harus dicatat alasannya di docs/internal/PLAN.md sebelum dipakai.

strategy:
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "AVAX/USDT"
    - "LINK/USDT"
    - "DOGE/USDT"
    - "ADA/USDT"
    - "HYPE/USDT"
  timeframe: "1d"
  donchian_entry_period: 20        # hari, untuk breakout entry
  donchian_exit_period: 10         # hari, untuk exit/breakout arah berlawanan
  atr_period: 14
  atr_stop_multiplier: 2.0         # stop loss = entry - (multiplier * ATR)
  direction: "long_only"           # long_only | long_short (short dicoret berbasis riset 2026-08-25)
  max_positions_per_cluster: 2     # Cluster-A2 (2026-09-06): maks 2 posisi per cluster korelasi. Cluster A (9 pair high-corr) + Cluster B (HYPE).
                                   # Mencegah overconcentration karena korelasi tinggi (avg cross-corr ~0.75). Hasil akhir: Sharpe 0.82, DD -26.19%.

risk:
  risk_per_trade_pct: 1.0          # persen dari modal per trade
  max_concurrent_positions: 5      # batas atas global; efektif lebih ketat karena cluster-limit
                                   # 2/cluster (A) + 1 (B) -> maksimum riil 3 posisi. Angka 5 sengaja
                                   # disimpan sebagai plafon; jangan naikkan tanpa riset korelasi ulang.
  max_drawdown_circuit_breaker_pct: 15.0   # auto-pause kalau drawdown modal awal tembus ini

paper_trading:
  data_source: "bitget"            # venue tunggal — konsisten dgn rencana eksekusi Fase 4 (mirror Binance dicabut 2026-09-08: satu venue, satu kebenaran harga)
  yield_apy_idle_cash: 0.0          # DINONAKTIFKAN 2026-10-02 (keputusan owner): simulasi bunga flat
                                   # tidak dipakai — bukan model earn sebenarnya (tanpa lockup/fee/risiko-platform)
                                   # dan backtest tidak menerapkannya. Yield yang sudah terkredit tetap di paper_cash
                                   # (tidak ditulis ulang). Aktifkan lagi hanya via config bila ada model yang benar.

backtest:
  lookback_years: 6                 # diperluas 3->6 (2020-08..2026-08) utk cakup bull-bear-bull penuh, atas instruksi user 2026-08-14
  initial_capital_usd: 1000        # nominal simulasi, bukan modal riil
  fee_pct: 0.1                     # taker fee asumsi, sesuaikan exchange
  slippage_pct: 0.05

llm_filter:
  enabled: false                   # aktifkan di Fase 3
  model: "deepseek-chat"
  call_only_on_valid_signal: true  # jangan panggil tiap candle, hemat cost

execution:
  mode: "paper"                    # backtest | paper | live
  exchange: "bitget"               # venue intent Fase 4: Bitget Exchange (API automation + exchange-side SL)

metrics:
  varsr:                            # VaRSR — kewajiban RQ1 (OD-3.11: IMPLEMENT). Formula & parameter dikunci.
    formula: "deng2013_eq12"        # VaRSR = SR - gamma * sigma_hat(SR); sigma_hat via Deng dkk. (2013) Eq. (12) / Mertens (2002)
    gamma: 1.96                     # two-sided 95% confidence (alpha = 0.05)
    confidence: 0.95                # two-sided
    return_frequency: "daily"       # daily strategy equity returns, pct_change().dropna()
    risk_free: 0.0                  # rf = 0 (selaras OD-6.4 untuk Sharpe)
    skewness: "sample"              # momen sampel miring (pandas .skew())
    kurtosis: "raw"                 # dipakai RAW kurtosis = excess + 3 di Eq. (12) (pandas .kurt() + 3)
    annualization: "none"           # TIDAK dikalikan sqrt(365) — Deng Eq. (12) tak menetapkan annualisasi; dilaporkan basis harian
